stages:
  - scan       # Статический анализ кода
  - validate   # Тесты на Scratch Org (для Pull Request)
  - deploy     # Деплой на Dev Org (после Merge)

# --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
variables:
  # Путь к определению скретч-орга
  SCRATCH_DEF: "config/project-scratch-def.json"
  # Имя Dev Hub (твоего основного орга, который управляет скретчами)
  DEV_HUB_ALIAS: "MyDevHub"

# =========================================================
# 1. PMD SCANNER (Запускается на Merge Request)
# =========================================================
pmd_scan:
  stage: scan
  only:
    - merge_requests
  script:
    - 'echo "=== STARTING PMD SCAN ==="'
    # Сканируем папку force-app, выводим в консоль, критичность ошибок 3+
    - 'sf scanner run --target "force-app" --format table --severity-threshold 3'

# =========================================================
# 2. ВАЛИДАЦИЯ НА SCRATCH ORG (Запускается на Merge Request)
# =========================================================
validate_scratch:
  stage: validate
  only:
    - merge_requests
  script:
    # 1. Создаем файл ключа
    - 'Set-Content -Path "temp_server.key" -Value $env:SERVER_KEY -Encoding Ascii'
    
    # 2. Авторизуемся в Dev Hub (Твой основной орг)
    - 'echo "Authorizing Dev Hub..."'
    - 'sf org login jwt --client-id $env:SF_CONSUMER_KEY --jwt-key-file "temp_server.key" --username $env:SF_USERNAME --alias $DEV_HUB_ALIAS --set-default-dev-hub --instance-url https://login.salesforce.com'
    
    # 3. Создаем Scratch Org (временный орг)
    - 'echo "Creating Scratch Org..."'
    - 'sf org create scratch --target-dev-hub $DEV_HUB_ALIAS --definition-file $SCRATCH_DEF --alias ci-scratch --duration-days 1 --set-default --wait 10'
    
    # 4. Пушим код в Scratch Org
    - 'echo "Pushing code to Scratch Org..."'
    - 'sf project deploy start --target-org ci-scratch --source-dir force-app'
    
    # 5. Запускаем тесты
    - 'echo "Running Apex Tests..."'
    - 'sf apex run test --target-org ci-scratch --test-level RunLocalTests --code-coverage --result-format human --wait 10'

  after_script:
    # 6. ВСЕГДА удаляем Scratch Org (даже если тест упал), удаляем ключ
    - 'echo "Cleaning up..."'
    - 'sf org delete scratch --target-org ci-scratch --no-prompt'
    - 'Remove-Item "temp_server.key" -ErrorAction SilentlyContinue'

# =========================================================
# 3. ДЕПЛОЙ В DEV ORG (Запускается ТОЛЬКО на ветке develop)
# =========================================================
deploy_to_dev:
  stage: deploy
  only:
    - develop
  script:
    - 'Set-Content -Path "temp_server.key" -Value $env:SERVER_KEY -Encoding Ascii'
    
    # Авторизация в Target Org
    - 'echo "Authorizing Target Org..."'
    - 'sf org login jwt --client-id $env:SF_CONSUMER_KEY --jwt-key-file "temp_server.key" --username $env:SF_USERNAME --alias target-org --instance-url https://login.salesforce.com'
    
    # Деплой и запуск тестов
    - 'echo "Deploying to Dev Org..."'
    - 'sf project deploy start --target-org target-org --source-dir force-app'
    - 'sf apex run test --target-org target-org --test-level RunLocalTests --wait 10'

  after_script:
    - 'Remove-Item "temp_server.key" -ErrorAction SilentlyContinue'