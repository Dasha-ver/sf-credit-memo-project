stages:
  - deploy

deploy_to_dev:
  stage: deploy
  only:
    - develop
  script:
    # --- ДИАГНОСТИКА ---
    - echo "=== DIAGNOSTICS START ==="
    - echo "Computer: $env:COMPUTERNAME"
    
    # Выводим переменную SF_USERNAME (в кавычках, чтобы не ломать YAML)
    - echo "SF_USERNAME is $env:SF_USERNAME"
    
    # Проверяем переменную ключа SERVER_KEY
    - echo "SERVER_KEY path is $env:SERVER_KEY"
    
    # Проверяем, видит ли система файл ключа
    - ls $env:SERVER_KEY
    
    - echo "=== DIAGNOSTICS END ==="

    # --- ЗАПУСК КОМАНДЫ ---
    # Мы используем переменные окружения Windows ($env:...)
    - sf org login jwt --client-id $env:SF_CONSUMER_KEY --jwt-key-file $env:SERVER_KEY --username $env:SF_USERNAME --alias target-org
    - sf project deploy start --target-org target-org --source-dir force-app