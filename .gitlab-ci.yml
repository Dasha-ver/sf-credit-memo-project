stages:
  - debug_and_deploy

deploy_to_dev:
  stage: debug_and_deploy
  only:
    - develop
  script:
    # --- ДИАГНОСТИКА (НАЧАЛО) ---
    - echo "=== DIAGNOSTICS START ==="
    - echo "Computer Name: $env:COMPUTERNAME"
    - echo "Check SF_USERNAME: [$env:SF_USERNAME]"
    - echo "Check SF_CONSUMER_KEY length: $($env:SF_CONSUMER_KEY.Length)"
    - echo "Check SERVER_KEY path: [$env:SERVER_KEY]"
    
    # Проверяем, существует ли файл ключа на диске
    - if (Test-Path "$env:SERVER_KEY") { echo "Key file exists!" } else { echo "Key file NOT found!" }
    - echo "=== DIAGNOSTICS END ==="
    # --- ДИАГНОСТИКА (КОНЕЦ) ---

    # Сама команда (добавил кавычки для надежности)
    - sf org login jwt --client-id "$env:SF_CONSUMER_KEY" --jwt-key-file "$env:SERVER_KEY" --username "$env:SF_USERNAME" --alias target-org
    - sf project deploy start --target-org target-org --source-dir force-app